# codemagic.yaml — Configuration pour build iOS cloud (sans Mac)
# Uploadez ce fichier à la racine du repo GitHub, connectez Codemagic
# https://codemagic.io (gratuit jusqu'à 500 min/mois)

workflows:

  # ───────────────────────────────────────────
  # BUILD ANDROID — AAB pour Google Play Store
  # ───────────────────────────────────────────
  android-release:
    name: Android Release (Play Store)
    max_build_duration: 30
    environment:
      android_signing:
        - flashrevise_keystore        # Nom du keystore ajouté dans Codemagic > Teams > Code signing
      groups:
        - google_play                 # Variables : GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        PACKAGE_NAME: "com.flashrevise.app"
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Add Android platform
        script: |
          npx cap add android || true
          npx cap sync android
      - name: Build Android Release AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/apk/release/app-release.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal           # Commence par internal, puis promotion vers production
        submit_as_draft: true

  # ───────────────────────────────────────────
  # BUILD iOS — IPA pour App Store (macOS cloud)
  # ───────────────────────────────────────────
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m1    # Machine macOS cloud Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.flashrevise.app
      groups:
        - app_store_connect
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.flashrevise.app"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Add iOS platform
        script: |
          chmod +x node_modules/.bin/cap || true
          npx cap add ios || true
          npx cap sync ios
      - name: Apply custom app icons (iOS)
        script: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -d "$ICONSET" ]; then
            rm -f "$ICONSET"/*.png
            cp -f ios-icons/*.png "$ICONSET"/
            cp -f ios-icons/Contents.json "$ICONSET"/Contents.json
            echo "Custom iOS icons applied:"
            ls -la "$ICONSET"
          else
            echo "ERROR: AppIcon.appiconset not found at $ICONSET"; exit 1
          fi
      - name: Set marketing + build number
        script: |
          cd ios/App
          # Numéro de version affiché sur l'App Store (doit correspondre à Android 1.2)
          agvtool new-marketing-version 1.2
          # CI regenerates the iOS project, so force a unique, increasing build number
          # to avoid the App Store Connect "build already exists" error on resubmission.
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Pin GoogleUserMessagingPlatform to 2.x (fix UMPConsentStatus)
        script: |
          cd ios/App
          # Le plugin admob 6.2.0 epingle Google-Mobile-Ads-SDK a 11.3.0 mais laisse
          # flotter GoogleUserMessagingPlatform, que CocoaPods resout vers la 3.x ou
          # UMPConsentStatus a ete renomme ConsentStatus -> echec de compilation.
          # On force UMP a rester en 2.x (API compatible avec le plugin).
          perl -0pi -e "s/(target 'App' do)/\$1\n  pod 'GoogleUserMessagingPlatform', '>= 2.0', '< 3.0'/" Podfile
          # Supprime le lock/Pods mis en cache par un build precedent (qui figeait UMP a 3.1.0)
          rm -rf Podfile.lock Pods
          echo '----- Podfile apres patch -----'
          cat Podfile
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
