<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="phone-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="1290" height="2796" fill="url(#bg-grad)"/>

  <!-- Marketing headline at top -->
  <text x="645" y="200" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="110" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="-2">Répétition espacée</text>
  <text x="645" y="320" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="58" font-weight="500"
        fill="#c7d2fe" text-anchor="middle">L'algorithme s'adapte à ta mémoire</text>

  <!-- Phone frame (iPhone 6.7" mock) -->
  <g transform="translate(95, 460)" filter="url(#phone-shadow)">
    <!-- Phone outer body -->
    <rect width="1100" height="2200" rx="120" ry="120" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="6"/>
    <!-- Screen -->
    <rect x="40" y="40" width="1020" height="2120" rx="90" ry="90" fill="#0f172a"/>
    <!-- Notch / Dynamic Island -->
    <rect x="430" y="80" width="240" height="60" rx="30" ry="30" fill="#000"/>
    <!-- App content -->
    <g transform="translate(40, 40)" clip-path="url(#screen-clip)">
      <defs>
        <clipPath id="screen-clip">
          <rect width="1020" height="2120" rx="90" ry="90"/>
        </clipPath>
      </defs>
      
      <!-- Header (top bar) -->
      <rect x="0" y="180" width="1020" height="130" fill="#1e293b"/>
      <line x1="0" y1="310" x2="1020" y2="310" stroke="#334155" stroke-width="2"/>
      <rect x="50" y="220" width="60" height="60" rx="16" ry="16" fill="url(#accent-grad)"/>
      <text x="80" y="262" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">FR</text>
      <text x="130" y="262" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="700" fill="#e2e8f0">FlashRevise</text>
      <!-- Streak badge -->
      <rect x="800" y="225" width="170" height="55" rx="28" ry="28" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.35)" stroke-width="2"/>
      <text x="885" y="263" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="700" fill="#fbbf24" text-anchor="middle">🔥 12j</text>

      <rect x="0" y="180" width="1020" height="130" fill="#1e293b"/>
      <line x1="0" y1="310" x2="1020" y2="310" stroke="#334155" stroke-width="2"/>
      <circle cx="100" cy="245" r="34" fill="#334155"/>
      <text x="100" y="260" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700" fill="#e2e8f0" text-anchor="middle">←</text>
      <text x="180" y="258" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700" fill="#e2e8f0">MPSI · Mathématiques</text>
      <text x="930" y="260" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="600" fill="#94a3b8" text-anchor="end">7/24</text>
      <rect x="0" y="310" width="1020" height="6" fill="#334155"/>
      <rect x="0" y="310" width="270" height="6" fill="#6366f1"/>

      <!-- Card flipped back -->
      <rect x="60" y="420" width="900" height="1020" rx="50" ry="50" fill="#1e293b" stroke="#6366f1" stroke-width="3"/>
      <text x="105" y="510" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="600" fill="#94a3b8" letter-spacing="2">RÉPONSE</text>
      <text x="105" y="600" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="38" font-weight="600" fill="#e2e8f0">∀(x,y) ∈ E²:</text>
      <text x="105" y="700" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="42" font-weight="700" fill="#6366f1">| ⟨x,y⟩ | ≤ ‖x‖ · ‖y‖</text>
      <line x1="105" y1="760" x2="915" y2="760" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
      <text x="105" y="830" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="30" fill="#94a3b8">avec égalité si et seulement si</text>
      <text x="105" y="880" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="30" fill="#94a3b8">les vecteurs x et y sont colinéaires.</text>
      <text x="105" y="990" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0">💡 Démonstration :</text>
      <text x="105" y="1050" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" fill="#94a3b8">Étudier le trinôme</text>
      <text x="105" y="1100" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" fill="#94a3b8">P(t) = ‖x + ty‖² ≥ 0</text>
      <text x="105" y="1180" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" fill="#94a3b8">→ discriminant ≤ 0</text>

      <!-- Hint -->
      <text x="510" y="1530" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="600" fill="#94a3b8" text-anchor="middle">Évalue ta maîtrise :</text>

      <!-- Rate buttons -->
      <g>
        <rect x="60" y="1580" width="210" height="170" rx="22" ry="22" fill="#ef4444"/>
        <text x="165" y="1665" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">À revoir</text>
        <text x="165" y="1715" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" fill="rgba(255,255,255,0.85)" text-anchor="middle">&lt; 1 min</text>
      </g>
      <g>
        <rect x="290" y="1580" width="210" height="170" rx="22" ry="22" fill="#f59e0b"/>
        <text x="395" y="1665" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">Difficile</text>
        <text x="395" y="1715" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" fill="rgba(255,255,255,0.85)" text-anchor="middle">6 min</text>
      </g>
      <g>
        <rect x="520" y="1580" width="210" height="170" rx="22" ry="22" fill="#10b981"/>
        <text x="625" y="1665" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">Bon</text>
        <text x="625" y="1715" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" fill="rgba(255,255,255,0.85)" text-anchor="middle">3 jours</text>
      </g>
      <g>
        <rect x="750" y="1580" width="210" height="170" rx="22" ry="22" fill="#3b82f6"/>
        <text x="855" y="1665" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">Facile</text>
        <text x="855" y="1715" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" fill="rgba(255,255,255,0.85)" text-anchor="middle">10 jours</text>
      </g>
    <rect x="0" y="1960" width="1020" height="160" fill="#1e293b"/>
<line x1="0" y1="1960" x2="1020" y2="1960" stroke="#334155" stroke-width="2"/>
<text x="102.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">🏠</text>
<text x="102.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">Accueil</text>
<text x="306.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">📚</text>
<text x="306.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">Fiches</text>
<text x="510.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">⚡</text>
<text x="510.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#6366f1" text-anchor="middle">Modes</text>
<text x="714.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">📊</text>
<text x="714.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">Stats</text>
<text x="918.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">⚙️</text>
<text x="918.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">Réglages</text>

    </g>
  </g>
</svg>