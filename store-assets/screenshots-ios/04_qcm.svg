<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="phone-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="1290" height="2796" fill="url(#bg-grad)"/>

  <!-- Marketing headline at top -->
  <text x="645" y="200" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="110" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="-2">4 modes de révision</text>
  <text x="645" y="320" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="58" font-weight="500"
        fill="#c7d2fe" text-anchor="middle">QCM · Vrai/Faux · Chrono · SRS</text>

  <!-- Phone frame (iPhone 6.7" mock) -->
  <g transform="translate(95, 460)" filter="url(#phone-shadow)">
    <!-- Phone outer body -->
    <rect width="1100" height="2200" rx="120" ry="120" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="6"/>
    <!-- Screen -->
    <rect x="40" y="40" width="1020" height="2120" rx="90" ry="90" fill="#0f172a"/>
    <!-- Notch / Dynamic Island -->
    <rect x="430" y="80" width="240" height="60" rx="30" ry="30" fill="#000"/>
    <!-- App content -->
    <g transform="translate(40, 40)" clip-path="url(#screen-clip)">
      <defs>
        <clipPath id="screen-clip">
          <rect width="1020" height="2120" rx="90" ry="90"/>
        </clipPath>
      </defs>
      
      <!-- Header (top bar) -->
      <rect x="0" y="180" width="1020" height="130" fill="#1e293b"/>
      <line x1="0" y1="310" x2="1020" y2="310" stroke="#334155" stroke-width="2"/>
      <rect x="50" y="220" width="60" height="60" rx="16" ry="16" fill="url(#accent-grad)"/>
      <text x="80" y="262" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">FR</text>
      <text x="130" y="262" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="700" fill="#e2e8f0">FlashRevise</text>
      <!-- Streak badge -->
      <rect x="800" y="225" width="170" height="55" rx="28" ry="28" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.35)" stroke-width="2"/>
      <text x="885" y="263" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="700" fill="#fbbf24" text-anchor="middle">🔥 12j</text>

      <rect x="0" y="180" width="1020" height="130" fill="#1e293b"/>
      <line x1="0" y1="310" x2="1020" y2="310" stroke="#334155" stroke-width="2"/>
      <circle cx="100" cy="245" r="34" fill="#334155"/>
      <text x="100" y="260" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700" fill="#e2e8f0" text-anchor="middle">←</text>
      <text x="180" y="258" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700" fill="#e2e8f0">QCM · Terminale Maths</text>
      <text x="930" y="260" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="600" fill="#94a3b8" text-anchor="end">4/10</text>
      <rect x="0" y="310" width="1020" height="6" fill="#334155"/>
      <rect x="0" y="310" width="408" height="6" fill="#6366f1"/>

      <!-- Question card -->
      <rect x="60" y="400" width="900" height="380" rx="40" ry="40" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <text x="510" y="500" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">QUESTION</text>
      <text x="510" y="610" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="700" fill="#e2e8f0" text-anchor="middle">Quelle est la dérivée</text>
      <text x="510" y="675" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="700" fill="#e2e8f0" text-anchor="middle">de la fonction</text>
      <text x="510" y="745" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" fill="#6366f1" text-anchor="middle">f(x) = ln(x² + 1) ?</text>

      <!-- Choices -->
    
      <rect x="60" y="830" width="900" height="180" rx="28" ry="28" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="3"/>
      <circle cx="160" cy="920" r="48" fill="#334155"/>
      <text x="160" y="938" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="800" fill="#e2e8f0" text-anchor="middle">A</text>
      <text x="240" y="938" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="38" font-weight="600" fill="#10b981">2x / (x² + 1)</text>
        <text x="900" y="938" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="60" font-weight="800" fill="#10b981" text-anchor="middle">✓</text>

      <rect x="60" y="1030" width="900" height="180" rx="28" ry="28" fill="#1e293b" stroke="#334155" stroke-width="3"/>
      <circle cx="160" cy="1120" r="48" fill="#334155"/>
      <text x="160" y="1138" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="800" fill="#e2e8f0" text-anchor="middle">B</text>
      <text x="240" y="1138" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="38" font-weight="600" fill="#e2e8f0">1 / (x² + 1)</text>
        
      <rect x="60" y="1230" width="900" height="180" rx="28" ry="28" fill="rgba(239,68,68,0.10)" stroke="#ef4444" stroke-width="3"/>
      <circle cx="160" cy="1320" r="48" fill="#334155"/>
      <text x="160" y="1338" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="800" fill="#e2e8f0" text-anchor="middle">C</text>
      <text x="240" y="1338" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="38" font-weight="600" fill="#ef4444">2x · ln(x² + 1)</text>
        <text x="900" y="1338" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="60" font-weight="800" fill="#ef4444" text-anchor="middle">✗</text>

      <rect x="60" y="1430" width="900" height="180" rx="28" ry="28" fill="#1e293b" stroke="#334155" stroke-width="3"/>
      <circle cx="160" cy="1520" r="48" fill="#334155"/>
      <text x="160" y="1538" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="800" fill="#e2e8f0" text-anchor="middle">D</text>
      <text x="240" y="1538" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="38" font-weight="600" fill="#e2e8f0">(x² + 1) / 2x</text>
        
      <!-- Next button -->
      <rect x="60" y="1690" width="900" height="120" rx="28" ry="28" fill="#6366f1"/>
      <text x="510" y="1765" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="700" fill="white" text-anchor="middle">Question suivante →</text>
    <rect x="0" y="1960" width="1020" height="160" fill="#1e293b"/>
<line x1="0" y1="1960" x2="1020" y2="1960" stroke="#334155" stroke-width="2"/>
<text x="102.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">🏠</text>
<text x="102.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">Accueil</text>
<text x="306.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">📚</text>
<text x="306.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">Fiches</text>
<text x="510.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">⚡</text>
<text x="510.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#6366f1" text-anchor="middle">Modes</text>
<text x="714.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">📊</text>
<text x="714.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">Stats</text>
<text x="918.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">⚙️</text>
<text x="918.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">Réglages</text>

    </g>
  </g>
</svg>