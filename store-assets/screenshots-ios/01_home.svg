      <rect x="850" y="1443" width="86" height="50" rx="14" ry="14" fill="#3b82f6"/>
      <text x="893" y="1478" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">12</text>
        
      <rect x="40" y="1560" width="940" height="160" rx="22" ry="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="68" y="1598" width="84" height="84" rx="22" ry="22" fill="rgba(99,102,241,0.15)"/>
      <text x="110" y="1655" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="44" text-anchor="middle">🇬🇧</text>
      <text x="178" y="1622" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="700" fill="#e2e8f0">Anglais · Vocabulaire</text>
      <text x="178" y="1662" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" fill="#94a3b8">284 cartes · 8 dues</text>
      <rect x="178" y="1680" width="600" height="6" rx="3" ry="3" fill="#334155"/>
