      <rect x="850" y="1618" width="86" height="50" rx="14" ry="14" fill="#10b981"/>
      <text x="893" y="1653" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">8</text>
        
      <rect x="40" y="1735" width="940" height="160" rx="22" ry="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="68" y="1773" width="84" height="84" rx="22" ry="22" fill="rgba(99,102,241,0.15)"/>
      <text x="110" y="1830" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="44" text-anchor="middle">📊</text>
      <text x="178" y="1797" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="700" fill="#e2e8f0">Terminale · Mathématiques</text>
      <text x="178" y="1837" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" fill="#94a3b8">298 cartes · 3 dues</text>
      <rect x="178" y="1855" width="600" height="6" rx="3" ry="3" fill="#334155"/>
      <rect x="178" y="1855" width="546" height="6" rx="3" ry="3" fill="#f59e0b"/>
      <rect x="850" y="1793" width="86" height="50" rx="14" ry="14" fill="#f59e0b"/>
      <text x="893" y="1828" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">3</text>
        <rect x="0" y="1960" width="1020" height="160" fill="#1e293b"/>
<line x1="0" y1="1960" x2="1020" y2="1960" stroke="#334155" stroke-width="2"/>
<text x="102.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">🏠</text>
<text x="102.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#6366f1" text-anchor="middle">Accueil</text>
<text x="306.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">📚</text>
<text x="306.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">Fiches</text>
<text x="510.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">⚡</text>
<text x="510.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">Modes</text>
<text x="714.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">📊</text>
<text x="714.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">Stats</text>
<text x="918.0" y="2020" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="46" text-anchor="middle">⚙️</text>
<text x="918.0" y="2070" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">Réglages</text>

    </g>
