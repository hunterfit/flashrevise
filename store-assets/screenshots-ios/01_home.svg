      <text x="185" y="1040" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="26" fill="#94a3b8" text-anchor="middle">cartes au total</text>

      <rect x="365" y="900" width="290" height="180" rx="22" ry="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <text x="510" y="985" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="800" fill="#6366f1" text-anchor="middle">312</text>
      <text x="510" y="1040" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="26" fill="#94a3b8" text-anchor="middle">maîtrisées</text>

      <rect x="690" y="900" width="290" height="180" rx="22" ry="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <text x="835" y="985" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="800" fill="#6366f1" text-anchor="middle">28</text>
      <text x="835" y="1040" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="26" fill="#94a3b8" text-anchor="middle">vues aujourd'hui</text>

      <!-- Section title -->
      <text x="40" y="1170" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="700" fill="#94a3b8" letter-spacing="2">MES NIVEAUX</text>
    
      <rect x="40" y="1210" width="940" height="160" rx="22" ry="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="68" y="1248" width="84" height="84" rx="22" ry="22" fill="rgba(99,102,241,0.15)"/>
      <text x="110" y="1305" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="44" text-anchor="middle">📐</text>
      <text x="178" y="1272" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="700" fill="#e2e8f0">MPSI · Mathématiques</text>
      <text x="178" y="1312" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="22" fill="#94a3b8">412 cartes · 24 dues</text>
      <rect x="178" y="1330" width="600" height="6" rx="3" ry="3" fill="#334155"/>
      <rect x="178" y="1330" width="372" height="6" rx="3" ry="3" fill="#6366f1"/>
      <rect x="850" y="1268" width="86" height="50" rx="14" ry="14" fill="#6366f1"/>
      <text x="893" y="1303" font-family="-apple-system, SF Pro Text, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">24</text>
        
      <rect x="40" y="1385" width="940" height="160" rx="22" ry="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="68" y="1423" width="84" height="84" rx="22" ry="22" fill="rgba(99,102,241,0.15)"/>
